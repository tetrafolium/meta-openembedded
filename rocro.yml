inspecode:
  tasks:
    - name: child-repo
      type: shell
      commands:
        - ls -alt ./
  coverity:
    options:
      --commands:
        - export REPODIR=$(pwd)
        - echo $REPODIR
        - ls -alt $REPODIR
        - cd $REPODIR/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
    artifacts:
      - path: ./report.json
    reports:
      - path: ./report.json
